/* Système de mouvement OxyMuscle — « sobre et dynamique » : transform + opacity uniquement */
:root{--dur-instant:90ms;--dur-fast:160ms;--dur-base:240ms;--dur-slow:400ms;--dur-exit-fast:112ms;--dur-exit-base:168ms;--ease-out:cubic-bezier(.2,.8,.2,1);--ease-in:cubic-bezier(.4,0,1,1);--ease-spring:cubic-bezier(.34,1.4,.64,1);--ease:var(--ease-out)}
.shell{position:relative}
/* 1. Appui */
.btn,.check,.icon-btn{transition:transform var(--dur-fast) var(--ease-out),opacity var(--dur-fast) var(--ease-out)}
.btn:hover{opacity:1;transform:none}
@media(hover:hover){.btn:hover{opacity:.88}}
.btn:not(:disabled):active,.check:not(:disabled):active,.icon-btn:not(:disabled):active{transform:scale(.97);transition-duration:var(--dur-instant)}
/* 2. Validation d'une série */
.set-row{position:relative;isolation:isolate}
.set-row::before{content:"";position:absolute;inset:-3px -6px;z-index:-1;border-radius:12px;background:color-mix(in srgb,var(--good),transparent 90%);opacity:0;pointer-events:none;transition:opacity var(--dur-base) var(--ease-out)}
.set-row.validated{background:none}
.set-row.validated::before{opacity:1}
.set-row.recent{animation:row-settle var(--dur-base) var(--ease-out)}
.check.done{animation:none}
.check.done.recent{animation:check-pop var(--dur-base) var(--ease-spring)}
.check-icon{display:inline-grid;place-items:center;width:18px;height:18px;line-height:1;font-size:15px}
.tick{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

<script>
/* OxyMuscle : champs de texte maison. Aucun <input> : une zone éditable pilotée en JS,
   avec .value et les événements input / change comme un champ natif (le reste de l'appli n'a rien à savoir). */
(() => {
  'use strict';
  const app = document.getElementById('app');
  if (!app) return;
  const SKIP = new Set(['class', 'type', 'value', 'placeholder', 'inputmode']);
  const read = (el, num, int) => {
    const t = el.textContent.replace(/[\r\n]/g, '');
    if (!num) return t;
    const n = t.replace(',', '.');
    return (int ? /^\d+$/ : /^(\d+\.?\d*|\.\d+)$/).test(n) ? n : '';
  };
  const caretEnd = el => {
    const r = document.createRange(), s = getSelection();
    r.selectNodeContents(el); r.collapse(false); s.removeAllRanges(); s.addRange(r);
  };
  const sync = el => {
    const has = el.textContent !== '';
    if (!has && el.firstChild) el.replaceChildren();
    el.toggleAttribute('data-filled', has);
  };
  function make(inp) {
    const num = inp.type === 'number', step = parseFloat(inp.getAttribute('step')) || 1, int = num && Number.isInteger(step), el = document.createElement('div');
    el.className = inp.className + ' ofield';
    for (const a of inp.attributes) if (!SKIP.has(a.name)) el.setAttribute(a.name, a.value);
    el.setAttribute('role', 'textbox'); el.tabIndex = 0;
    try { el.contentEditable = 'plaintext-only'; } catch (_) { el.contentEditable = 'true'; }
    el.setAttribute('inputmode', inp.getAttribute('inputmode') || (num ? (int ? 'numeric' : 'decimal') : 'text'));
    el.setAttribute('enterkeyhint', 'done'); el.setAttribute('autocapitalize', 'off'); el.setAttribute('autocorrect', 'off'); el.spellcheck = false;
    Object.defineProperty(el, 'value', { configurable: true, get: () => read(el, num, int), set: v => { el.textContent = v == null ? '' : String(v); sync(el); } });
    el.textContent = inp.value; sync(el);
    let start = el.textContent, pointer = 0;
    el.addEventListener('pointerdown', () => { pointer = Date.now(); });
    el.addEventListener('focus', () => { start = el.textContent; if (num) requestAnimationFrame(() => { const r = document.createRange(), s = getSelection(); r.selectNodeContents(el); s.removeAllRanges(); s.addRange(r); }); else if (Date.now() - pointer > 400) caretEnd(el); });
    el.addEventListener('blur', () => { if (el.textContent !== start) { start = el.textContent; el.dispatchEvent(new Event('change', { bubbles: true })); } });
    el.addEventListener('beforeinput', e => {
      if (e.inputType === 'insertParagraph' || e.inputType === 'insertLineBreak') { e.preventDefault(); return; }
      if (num && e.data && !(int ? /^\d+$/ : /^[\d.,]+$/).test(e.data)) e.preventDefault();
    });
    el.addEventListener('input', () => {
      if (num) { const c = el.textContent.replace(int ? /[^\d]/g : /[^\d.,]/g, ''); if (c !== el.textContent) { el.textContent = c; caretEnd(el); } }
      sync(el);
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); return; }
      if (!num || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
      e.preventDefault();
      const min = parseFloat(el.getAttribute('min')), max = parseFloat(el.getAttribute('max'));
      let v = (parseFloat(read(el, true, int)) || 0) + (e.key === 'ArrowUp' ? step : -step);
      if (!isNaN(min)) v = Math.max(min, v);
      if (!isNaN(max)) v = Math.min(max, v);
      el.value = +v.toFixed(2); caretEnd(el);
      el.dispatchEvent(new Event('input', { bubbles: true }));
    });
    el.addEventListener('paste', e => {
      e.preventDefault();
      document.execCommand('insertText', false, (e.clipboardData?.getData('text/plain') || '').replace(/[\r\n]+/g, ' '));
    });
    el.addEventListener('drop', e => e.preventDefault());
    inp.replaceWith(el);
  }
  const upgrade = root => root.querySelectorAll('input.field').forEach(make);
  // Chaque rendu (app.innerHTML = …) est transformé aussitôt, avant tout .focus() du code existant.
  const d = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
  Object.defineProperty(app, 'innerHTML', { configurable: true, get() { return d.get.call(this); }, set(v) { d.set.call(this, v); upgrade(this); } });
  upgrade(app);
  window.OxyFields = { upgrade };
})();

nabled" type="checkbox" ${db.profile.warmup!==false?'checked':''}><span>Échauffement avant chaque séance</span></label><h2 class="sectionhead">Langue</h2><div class="seg" role="group" aria-label="Langue">${[['fr','Français'],['en','English']].map(([k,l])=>`<button class="chip" data-lang="${k}" aria-pressed="${(window.OXY_LANG||'fr')===k}">${l}</button>`).join('')}</div><h2 class="sectionhead">Chrono de repos</h2><p class="note">Choisis sa position. Pendant un repos, glisse-le où tu veux.</p><div class="seg" role="group" aria-label="Position du chrono">${[['bottom','Bas'],['top','Haut'],['left','Gauche'],['right','Droite'],['free','Libre']].map(([k,l])=>`<button class="chip" data-timer-pos="${k}" aria-pressed="${db.profile.timer.mode===k}">${l}</button>`).join('')}</div><button class="btn secondary" id="timerTest">Tester le chrono</button><p class="note" style="margin-top:20px">Le fichier fonctionne sans connexion. Le stockage local peut être effacé par les réglages du navigateur ; garde une copie JSON à part.</p>`;animateCounters()}
function openModal(title,text,label,action,destructive=false){clearTimeout(modalCloseTimer);modalCloseTimer=null;modalGeneration++;dialogAction=action;dialogOpener=document.activeElement;$('#modalTitle').textContent=title;$('#modalText').textContent=text;$('#modalConfirm').textContent=label;$('#modalConfirm').classList.toggle('danger',destructive);const modal=$('#confirmModal');modal.hidden=false;modal.classList.remove('closing');modal.classList.add('opening');$('#modalCancel').focus()}function closeModal(accepted=false){const modal=$('#confirmModal'),callback=dialogAction,returnFocus=dialogOpener,token=++modalGeneration;dialogAction=null;modal.classList.remove('opening');modal.classList.add('closing');clearTimeout(modalCloseTimer);modalCloseTimer=setTimeout(()=>{if(token!==modalGeneration)return;modal.hidden=true;modal.classList.remove('closing');modalCloseTimer=null;const target=returnFocus?.isConnected?returnFocus:document.querySelector('[role="tab"][data-view="'+view+'"]');target?.focus({preventScroll:true})},MOTION.exitBase+8);if(accepted)callback?.()}function trapFocus(e){if($('#confirmModal').hidden)return;if(e.key==='Escape'){e.preventDefault();closeModal();return}if(e.key!=='Tab')return;const list=[...$('#confirmModal').querySelectorAll('button:not([disabled])')],first=list[0],last=list[list.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
function addDay(){if(db.program.length>=50){showToast('Limite de 50 jours atteinte.');return}const day={id:uid('day'),name:'Nouvelle séance',exercises:[]};db.program.push(day);dayId=day.id;db.selectedDayId=dayId;openDays.add(day.id);save();renderProgram();const card=app.querySelector('[data-day-card="'+CSS.escape(day.id)+'"]');card?.classList.add('fade-slide-in');card?.querySelector('.dayname-input')?.focus({preventScroll:true})}function addExercise(id){const d=db.program.find(x=>x.id===id);if(!d)return;if(d.exercises.length>=200){showToast('Limite de 200 exercices par jour atteinte.');return}const ex={id:uid('ex'),name:'Nouvel exercice',sets:3,reps:'8-12',rest:90,mode:'external',method:'volume'};d.exercises.push(ex);save();renderProgram();const row=app.querySelector('[data-edit-ex="'+CSS.escape(ex.id)+'"]');row?.classList.add('fade-slide-in');row?.querySelector('.ename')?.focus({preventScroll:true})}function askDeleteDay(id,button){const d=db.program.find(x=>x.id===id),node=button.closest('.day-editor');if(!d)return;openModal('Supprimer ce jour ?',`« ${d.name} » et ses exercices seront retirés du programme. L’historique sera conservé.`,'Supprimer',()=>{db.program=db.program.filter(x=>x.id!==id);if(db.activeSession?.dayId===id){db.activeSession=null;hideTimer()}dayId=db.program[0]?.id||null;save();exitThen(node,()=>{if(view==='program')renderProgram()})},true)}

function moveExercise(dayKey,id,delta){const d=db.program.find(x=>x.id===dayKey);if(!d)return;const i=d.exercises.findIndex(x=>x.id===id),j=i+delta;if(i<0||j<0||j>=d.exercises.length)return;[d.exercises[i],d.exercises[j]]=[d.exercises[j],d.exercises[i]];save();renderProgram()}

function validateBackup(o){if(!o||typeof o!=='object'||Array.isArray(o)||!Array.isArray(o.program)||!Array.isArray(o.logs))throw Error('Structure de sauvegarde invalide.');if(o.program.length>50||o.logs.length>100000)throw Error('La sauvegarde dépasse les limites acceptées.');for(const d of o.program){if(!d||typeof d.name!=='string'||d.name.length>100||!Array.isArray(d.exercises)||d.exercises.length>200)throw Error('Jour ou liste d’exercices invalide.');for(const e of d.exercises){if(Array.isArray(e)){if(e.length<4||typeof e[0]!=='string'||!e[0].trim()||e[0].length>120||!Number.isInteger(+e[1])||+e[1]<1||+e[1]>100||String(e[2]||'').length>100||!Number.isFinite(+e[3])||+e[3]<0||+e[3]>3600)throw Error('Exercice au format historique invalide.');continue}if(!e||typeof e.name!=='string'||e.name.length>120||!Number.isFinite(+e.sets)||+e.sets<1||+e.sets>100||!Number.isFinite(+e.rest)||+e.rest<0||+e.rest>3600||typeof e.reps!=='string'||e.reps.length>100)throw Error('Valeurs d’exercice invalides.')}}for(const l of o.logs){if(!l||typeof l.date!=='string'||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(l.date)||typeof l.exerciseId!=='string'||!Number.isInteger(+l.set)||+l.set<1||!Number.isFinite(+l.reps)||+l.reps<1||+l.reps>10000||!Number.isFinite(+l.weight)||+l.weight<0)throw Error('Valeurs de série invalides.')}return normalize(o)}
async function importFile(file){try{if(file.size>25*1024*1024)throw Error('Fichier supérieur à 25 Mo.');const next=validateBackup(JSON.parse(await file.text()));openModal('Remplacer les données ?',`Cette sauvegarde contient ${next.program.length} jours, ${next.logs.length} séries et ${next.sessions.length} séances. Elle remplacera les données présentes après confirmation.`,'Importer',()=>{if(save(next)){db=next;dayId=db.activeSession?.dayId||db.selectedDayId||db.program[0]?.id;showToast('Sauvegarde importée.');draw()}})}catch(error){showToast(`Import refusé : ${error.message||'fichier invalide'}.`)}}
function handleClick(e){const tab=e.target.closest('[role="tab"]');if(tab){switchView(tab.dataset.view);return}const b=e.target.closest('button');if(!b)return;if(b.dataset.lang){window.setOxyLang&&window.setOxyLang(b.dataset.lang);return}const wuA=b.dataset.action;if(wuA&&wuA.startsWith('wu-')){wuAction(wuA);return}if(b.dataset.timerPos){db.profile.timer={...db.profile.timer,mode:b.dataset.timerPos};save();applyTimerPos();app.querySelectorAll('[data-timer-pos]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));showToast('Position du chrono mise à jour.');return}if(b.id==='timerTest'){startTimer(Date.now()+30000,30);return}if(b.id==='startSession'){startWorkout();return}if(b.dataset.action==='start-routine'){startWorkout(b.dataset.day);return}if(b.id==='finishSession'){finishWorkout();return}if(b.id==='plus'){if(db.activeSession){db.activeSession.restEndsAt=(db.activeSession.restEndsAt||Date.now())+15000;db.activeSession.restDuration=(+$('#timer').dataset.duration||90)+15;$('#timer').dataset.endAt=db.activeSession.restEndsAt;$('#timer').dataset.duration=db.activeSession.restDuration;save(true);tickTimer()}return}if(b.id==='skip'){if(db.activeSession){db.activeSession.restEndsAt=null;save(true)}hideTimer();return}if(b.id==='toastAction'){const action=toastActionCallback;toastActionCallback=null;action?.();hideToast();return}if(b.id==='modalCancel'){closeModal();return}if(b.id==='modalConfirm'){closeModal(true);return}if(b.id==='newDay'){addDay();return}if(b.id==='reset'){resetProgram();return}if(b.id==='export'){doExport();return}if(b.id==='choose'){$('#importFile').click();return}if(b.dataset.goto){switchView(b.dataset.goto);return}const a=b.dataset.action;if(a==='validate')validateSet(b);else if(a==='add-set')addSet(b.dataset.e);else if(a==='remove-set')removeSet(b);else if(a==='add-ex')addExercise(b.dataset.day);else if(a==='delete-ex')askDeleteEx(b.dataset.day,b.dataset.ex,b);else if(a==='delete-day')askDeleteDay(b.dataset.day,b);else if(a==='move-up')moveExercise(b.dataset.day,b.dataset.ex,-1);else if(a==='move-down')moveExercise(b.dataset.day,b.dataset.ex,1);else if(a==='toggle-mode'){const ex=db.program.find(d=>d.id===b.dataset.day)?.exercises.find(x=>x.id===b.dataset.ex);if(ex){ex.mode=ex.mode==='bodyweight'?'external':'bodyweight';save();renderProgram()}}else if(a==='duplicate-day'){const old=db.program.find(d=>d.id===b.dataset.day);if(old){const copy=JSON.parse(JSON.stringify(old));copy.id=uid('day');copy.name=`${old.name} (copie)`;copy.exercises.forEach(ex=>ex.id=uid('ex'));db.program.splice(db.program.indexOf(old)+1,0,copy);openDays.add(copy.id);save();renderProgram();const card=app.querySelector(`[data-day-card="${CSS.escape(copy.id)}"]`);card?.classList.add('fade-slide-in')}}}
function handleChange(e){const t=e.target;if(t.id==='exerciseSelect'){const groups=new Map();for(const l of db.logs){if(!groups.has(l.exerciseId))groups.set(l.exerciseId,{id:l.exerciseId,name:l.exerciseName||'Exercice',mode:l.mode||'external',logs:[]});const g=groups.get(l.exerciseId);g.logs.push(l);if(l.mode==='bodyweight')g.mode='bodyweight'}drawChart([...groups.values()].find(g=>g.id===t.value));return}if(t.id==='daySelect'){const requestedDay=t.value;if(db.activeSession&&requestedDay!==db.activeSession.dayId){t.value=db.activeSession.dayId;showToast('Termine la séance en cours avant de changer de séance.');return}dayId=requestedDay;db.selectedDayId=dayId;save();renderTrain();$('#daySelect')?.focus({preventScroll:true});return}if(t.id==='bodyweight'){const n=t.value===''?null:Number(t.value);if(n!==null&&(!Number.isFinite(n)||n<20||n>300)){t.classList.add('error');showToast('Le poids doit être compris entre 20 et 300 kg.');return}t.classList.remove('error');db.profile.bodyweightKg=n;save();return}if(t.id==='warmupEnabled'){db.profile.warmup=t.checked;save();return}if(t.id==='soundEnabled'){db.profile.soundEnabled=t.checked;save();return}const d=db.program.find(x=>x.id===t.dataset.day),ex=d?.exercises.find(x=>x.id===t.dataset.ex);if(t.classList.contains('dayname-input')&&d){d.name=t.value.slice(0,100);{const dn=app.querySelector('[data-day-card="'+CSS.escape(d.id)+'"] .dn');if(dn)dn.textContent=d.name}if(db.activeSession?.dayId===d.id)db.activeSession.dayName=d.name;save();return}if(!ex)return;if(t.classList.contains('ename'))ex.name=t.value.slice(0,120);else if(t.classList.contains('esets'))ex.sets=Math.max(1,Math.min(100,Math.floor(+t.value||1)));else if(t.classList.contains('ereps'))ex.reps=t.value.slice(0,100);else if(t.classList.contains('erest'))ex.rest=Math.max(0,Math.min(3600,Math.floor(+t.value||0)));else if(t.classList.contains('emethod')){applyMethod(ex,t.value);save();renderProgram();return}else if(t.classList.contains('eint'))ex.interval=Math.max(15,Math.min(600,Math.floor(+t.value||60)));else return;{const h=app.querySelector('[data-edit-ex="'+CSS.escape(ex.id)+'"] .px-hint');if(h)h.textContent=hintFor(ex)}save()}

const colorScheme=matchMedia('(prefers-color-scheme: dark)');function updateTheme(){document.querySelector('#themeColor').content='#0a0a0b'}colorScheme.addEventListener?.('change',updateTheme);updateTheme();todayLabel();draw();stagger();placeIndicator();document.fonts?.ready?.then(placeIndicator);addEventListener('resize',placeIndicator);if(loaded.migrated)showToast('Données migrées vers OxyMuscle. La copie d’origine est conservée.');if(loaded.failed)showToast('Stockage inaccessible ou données illisibles. Importe une sauvegarde JSON si tu en as une.');

<script>
/* OxyMuscle : choix de la langue (FR / EN). Réglage mémorisé, puis chargement de la bonne version du code. */
(()=>{'use strict';
const KEY='oxymuscle-lang';let lang='';
try{lang=localStorage.getItem(KEY)||''}catch(_){}
if(lang!=='fr'&&lang!=='en')lang=String(navigator.language||'fr').toLowerCase().startsWith('en')?'en':'fr';
document.documentElement.lang=lang;window.OXY_LANG=lang;
window.setOxyLang=l=>{try{localStorage.setItem(KEY,l==='en'?'en':'fr')}catch(_){}location.reload()};

if(lang==='en'){
  const M={'Séance':'Workout','Progrès':'Progress','Programme':'Program','Données':'Data','REPOS':'REST','Passer le repos':'Skip rest','Série validée':'Set logged','Confirmer':'Confirm','Annuler':'Cancel','Supprimer':'Delete'};
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n.parentNode&&n.parentNode.tagName==='SCRIPT')continue;const t=n.nodeValue.trim();if(M[t])n.nodeValue=n.nodeValue.replace(t,M[t])}
  const tabs=document.getElementById('tabs');if(tabs)tabs.setAttribute('aria-label','OxyMuscle sections');
  document.title=document.title.replace('Carnet de musculation','Workout log');
}

const sfx=lang==='en'?'.en':'',mobile=document.documentElement.hasAttribute('data-mobile'),embedded=document.getElementById('app-'+lang);
if(embedded){ // version tout-en-un : le code des deux langues est embarqué dans le fichier
  const run=id=>{const b=document.getElementById(id);if(!b)return;const s=document.createElement('script');s.textContent=b.textContent;document.body.appendChild(s)};
  run('app-'+lang);if(mobile)run('mobile-'+lang);
}else{ // version dossier
  document.write('<script src="js/app'+sfx+'.js"><\/script>');
  if(mobile)document.write('<script src="js/mobile'+sfx+'.js"><\/script>');
}
})();
